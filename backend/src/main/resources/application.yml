server:
  port: 8080

spring:
  application:
    name: ipcms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ipcms-backend
    driverClassName: org.postgresql.Driver
    username: postgres
    password: jai
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Security Configuration (SRS Appendix D)
