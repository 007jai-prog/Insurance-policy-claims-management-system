# 12 hours for internal underwriting/claim operators (UNDERWRITER, HANDLER, ADMIN) = 43,200,000 ms
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    client-expiration-ms: 28800000
    internal-expiration-ms: 43200000
